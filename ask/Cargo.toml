[package]
name = "fuin-ask"
version = "0.1.0"
edition = "2021"
description = "Fūin asker: makes each sealed question's one model call inside an OutLayer TDX enclave and refuses a second ask"
license = "MIT"
publish = false

[[bin]]
name = "fuin-ask"
path = "src/main.rs"

[dependencies]
fuin-tee = { path = "../tee" }  # the scorer's exact request builder, signature check, scoring and roots
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
outlayer = { version = "=0.2.1", features = ["encryption-keys"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
getrandom = "0.3"
base64 = "0.22"
wasi-http-client = "0.2.1"
wasi = "=0.13.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

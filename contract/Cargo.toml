[package]
name = "fuin-registry"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fexx301/fuin"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

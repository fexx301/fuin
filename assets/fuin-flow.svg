<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 206" role="img" aria-labelledby="t d">
<title id="t">How a Fūin round works</title>
<desc id="d">Six steps: 1 Seal the questions' Merkle root and policy on NEAR. 2 Run: the model in a TEE signs each answer. 3 Commit each run's root and total on NEAR. 4 Close the round. 5 Check: a future NEAR block picks a sample to reveal, or a TEE scores every answer. 6 Verify: anyone, with no account, gets VERIFIED, REFUSED or CAN'T CERTIFY. In an asked-once round a TEE makes step 2's model calls itself, once per question.</desc>
<style>
  .box { fill: none; stroke: #192527; stroke-opacity: .35; stroke-width: 1.5; }
  .key { stroke: #B6382C; stroke-opacity: 1; }
  .n { fill: #B6382C; font: 600 13px ui-monospace, Menlo, Consolas, monospace; }
  .h { fill: #192527; font: 600 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .s { fill: #192527; fill-opacity: .75; font: 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .a { stroke: #192527; stroke-opacity: .5; stroke-width: 1.5; fill: none; }
  .ah { fill: #192527; fill-opacity: .5; }
  .note { fill: #192527; fill-opacity: .75; font: italic 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
<defs><marker id="m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L8 4L0 8z"/></marker></defs>
<g>
  <rect class="box key" x="2" y="12" width="136" height="140" rx="8"/>
  <text class="n" x="16" y="36">1 · NEAR</text><text class="h" x="16" y="60">Seal</text>
  <text class="s" x="16" y="84">questions' Merkle</text><text class="s" x="16" y="101">root and policy</text><text class="s" x="16" y="118">on chain first</text>

  <rect class="box" x="162" y="12" width="136" height="140" rx="8"/>
  <text class="n" x="176" y="36">2 · NEAR AI</text><text class="h" x="176" y="60">Run</text>
  <text class="s" x="176" y="84">the model in a</text><text class="s" x="176" y="101">TEE signs each</text><text class="s" x="176" y="118">answer</text>

  <rect class="box" x="322" y="12" width="136" height="140" rx="8"/>
  <text class="n" x="336" y="36">3 · NEAR</text><text class="h" x="336" y="60">Commit</text>
  <text class="s" x="336" y="84">each run's root</text><text class="s" x="336" y="101">and total</text>

  <rect class="box" x="482" y="12" width="136" height="140" rx="8"/>
  <text class="n" x="496" y="36">4 · NEAR</text><text class="h" x="496" y="60">Close</text>
  <text class="s" x="496" y="84">no more runs</text><text class="s" x="496" y="101">can join</text>

  <rect class="box" x="642" y="12" width="136" height="140" rx="8"/>
  <text class="n" x="656" y="36">5 · OutLayer</text><text class="h" x="656" y="60">Check</text>
  <text class="s" x="656" y="84">a future block</text><text class="s" x="656" y="101">picks a sample, or</text><text class="s" x="656" y="118">a TEE scores all</text>

  <rect class="box key" x="802" y="12" width="136" height="140" rx="8"/>
  <text class="n" x="816" y="36">6 · anyone</text><text class="h" x="816" y="60">Verify</text>
  <text class="s" x="816" y="84">no account, no</text><text class="s" x="816" y="101">test set: VERIFIED,</text><text class="s" x="816" y="118">REFUSED or</text><text class="s" x="816" y="135">CAN'T CERTIFY</text>

  <path class="a" marker-end="url(#m)" d="M140 82h20"/>
  <path class="a" marker-end="url(#m)" d="M300 82h20"/>
  <path class="a" marker-end="url(#m)" d="M460 82h20"/>
  <path class="a" marker-end="url(#m)" d="M620 82h20"/>
  <path class="a" marker-end="url(#m)" d="M780 82h20"/>

  <text class="note" x="2" y="192">Asked once (round 7): a TEE in a locked OutLayer project makes step 2's model calls itself, once per question, after the seal.</text>
</g>
</svg>

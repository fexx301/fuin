name: re-verify
# Every published certificate re-verified each day, keyless, through judging (NEAR HACKATHON judging, Nov 16-18, 2026).
# It catches anything that would stop a certificate verifying: Intel collateral or TCB status, NVIDIA's NRAS, NEAR's
# archival RPC, OutLayer's worker approvals, NEAR's deployment repo. No secrets: it runs exactly as a stranger would.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify every certificate (no account, no API key)
        run: |
          set -o pipefail
          uv run fuin verify --json examples/cert-*.json | tee verify.jsonl
          uv run python -c "import json; rs = [json.loads(l) for l in open('verify.jsonl')]; print(sum(r['outcome'] == 'VERIFIED' for r in rs), 'of', len(rs), 'VERIFIED')"
      - name: Every tamper fixture still gets its verdict
        run: uv run python scripts/check_fixtures.py examples/tampered/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-${{ github.run_id }}
          path: verify.jsonl

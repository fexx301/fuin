name: re-verify
# The whole judge path, each day through judging (NEAR HACKATHON judging, Nov 16-18, 2026): every published certificate
# verified keyless, every tamper fixture, the unit tests, the canonical TEE scorer rebuild (Docker) and the in-browser
# verifier. It catches anything that would stop a certificate verifying: Intel collateral or TCB status, NVIDIA's NRAS,
# NEAR's archival RPC, OutLayer's worker approvals, NEAR's deployment repo. No secrets: it runs as a stranger would.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The TEE scorer's pinned Rust toolchain, so its tests against Python run too
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-wasip2
      - name: scripts/review.sh (retries a public service's rate limit; never retries a verdict)
        run: |
          set -o pipefail
          scripts/review.sh 2>&1 | tee review.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-${{ github.run_id }}
          path: review.log

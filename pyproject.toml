[project]
name = "fuin"
version = "1.3.0"
description = "Sealed benchmark results with verifiable NEAR AI Cloud TEE signatures and a re-scorable audit sample"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "rfc8785==0.1.4",
    "requests>=2.32",
    "eth-account>=0.13",
    "dcap-qvl==0.7.0",
    "pyyaml>=6.0.3",
    "cryptography>=50.0.2",
    "sigstore>=4",
]

[project.urls]
Homepage = "https://github.com/fexx301/fuin"
Repository = "https://github.com/fexx301/fuin"
Documentation = "https://github.com/fexx301/fuin#readme"

[project.scripts]
fuin = "fuin.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuin"]

[tool.hatch.build.targets.sdist]  # the package and its policies; the site, evidence and examples stay in the repository
include = ["src/fuin", "policy", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel.force-include]
"policy" = "fuin/policy"  # an installed fuin carries the verifier's pinned policies

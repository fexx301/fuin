[project]
name = "fuin"
version = "0.1.0"
description = "Sealed benchmark results with verifiable NEAR AI Cloud TEE signatures and a re-scorable audit sample"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "rfc8785==0.1.4",
    "requests>=2.32",
    "eth-account>=0.13",
    "dcap-qvl==0.7.0",
    "pyyaml>=6.0.3",
    "cryptography>=50.0.2",
    "sigstore>=4",
]

[project.scripts]
fuin = "fuin.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"
